<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Chat Room</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #chat-screen {
            display: flex;
            width: 90%;
            max-width: 500px;
            height: 80vh;
            background: #1e1e1e;
            border-radius: 12px;
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        h2 {
            margin-top: 0;
            color: #bb86fc;
            text-align: center;
        }
        #messages {
            flex-grow: 1;
            overflow-y: auto;
            border: 1px solid #333;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #121212;
        }
        .input-box {
            display: flex;
            gap: 10px;
        }
        input {
            flex-grow: 1;
            padding: 12px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            outline: none;
        }
        button {
            padding: 12px 20px;
            background: #bb86fc;
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #a362ea;
        }
    </style>
</head>
<body>

    <div id="chat-screen">
        <h2>👻 Ghost Secret Tunnel</h2>
        <div id="messages"></div>
        <div class="input-box">
            <input type="text" id="msg-input" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const socket = io();

        function sendMessage() {
            const input = document.getElementById('msg-input');
            if (input.value.trim() !== "") {
                socket.emit('send_message', { msg: input.value });
                input.value = "";
            }
        }

        socket.on('receive_message', (data) => {
            const msgBox = document.getElementById('messages');
            msgBox.innerHTML += `<p style="margin: 5px 0;"><b>Peer:</b> ${data.msg}</p>`;
            msgBox.scrollTop = msgBox.scrollHeight;
        });
    </script>
</body>
</html>
